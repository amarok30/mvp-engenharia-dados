<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 652" width="960" height="652" role="img" aria-label="Constelação de fatos da camada Gold: três tabelas fato ligadas por duas dimensões conformadas">
<title>Camada Gold: constelação de fatos com dimensões conformadas</title>
<desc>Três tabelas fato de processos distintos (respostas da pesquisa, teletrabalho por UF, ocupação por UF e atividade) compartilham as dimensões conformadas dim_periodo e dim_geografia. Cinco dimensões específicas pertencem a uma única fato.</desc>
<style>
  .bg{fill:#fbfaf8}
  .ttl{font:600 17px ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1c1a17}
  .sub{font:12px ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#6b6560}
  .bx{font:600 13px ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .bs{font:11px ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  .lnk{stroke:#b7ada2;stroke-width:1.4;fill:none}
  .lnkc{stroke:#2f6b45;stroke-width:1.8;fill:none}
  .lbl{font:600 11px ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.06em}
</style>

<rect class="bg" x="0" y="0" width="960" height="652"/>

<text class="ttl" x="30" y="30">Camada Gold: constelação de fatos</text>
<text class="sub" x="30" y="50">Três processos de negócio distintos, ligados por duas dimensões conformadas. O modelo existe só na Gold.</text>

<text class="lbl" x="30" y="97" fill="#2f6b45">DIMENSÕES CONFORMADAS</text>

<g>
  <rect x="250" y="70" width="210" height="50" rx="7" fill="#e8f1ea" stroke="#2f6b45" stroke-width="1.6"/>
  <text class="bx" x="355" y="92" text-anchor="middle" fill="#1c1a17">dim_periodo</text>
  <text class="bs" x="355" y="108" text-anchor="middle" fill="#6b6560">ano · trimestre</text>

  <rect x="500" y="70" width="210" height="50" rx="7" fill="#e8f1ea" stroke="#2f6b45" stroke-width="1.6"/>
  <text class="bx" x="605" y="92" text-anchor="middle" fill="#1c1a17">dim_geografia</text>
  <text class="bs" x="605" y="108" text-anchor="middle" fill="#6b6560">país · Brasil · UF</text>
</g>

<path class="lnkc" d="M355 120 L155 250"/>
<path class="lnkc" d="M355 120 L480 250"/>
<path class="lnkc" d="M355 120 L805 250"/>
<path class="lnkc" d="M605 120 L155 250"/>
<path class="lnkc" d="M605 120 L480 250"/>
<path class="lnkc" d="M605 120 L805 250"/>

<text class="lbl" x="30" y="238" fill="#8a4b2a">TABELAS FATO</text>

<g>
  <rect x="30" y="250" width="250" height="90" rx="7" fill="#f5ece5" stroke="#8a4b2a" stroke-width="1.8"/>
  <text class="bx" x="155" y="274" text-anchor="middle" fill="#1c1a17">fato_resposta_pesquisa</text>
  <text class="bs" x="155" y="294" text-anchor="middle" fill="#6b6560">grão: um respondente por safra</text>
  <text class="bs" x="155" y="311" text-anchor="middle" fill="#6b6560">Stack Overflow · autosselecionada</text>
  <text class="bs" x="155" y="328" text-anchor="middle" fill="#6b6560">sem peso amostral</text>

  <rect x="355" y="250" width="250" height="90" rx="7" fill="#f5ece5" stroke="#8a4b2a" stroke-width="1.8"/>
  <text class="bx" x="480" y="274" text-anchor="middle" fill="#1c1a17">fato_teletrabalho_uf</text>
  <text class="bs" x="480" y="294" text-anchor="middle" fill="#6b6560">grão: território × modalidade</text>
  <text class="bs" x="480" y="311" text-anchor="middle" fill="#6b6560">PNAD Contínua 2022 · 4º tri</text>
  <text class="bs" x="480" y="328" text-anchor="middle" fill="#6b6560">estimativa ponderada, com CV</text>

  <rect x="680" y="250" width="250" height="90" rx="7" fill="#f5ece5" stroke="#8a4b2a" stroke-width="1.8"/>
  <text class="bx" x="805" y="274" text-anchor="middle" fill="#1c1a17">fato_ocupacao_uf_atividade</text>
  <text class="bs" x="805" y="294" text-anchor="middle" fill="#6b6560">grão: UF × trimestre × atividade</text>
  <text class="bs" x="805" y="311" text-anchor="middle" fill="#6b6560">PNAD Contínua · série trimestral</text>
  <text class="bs" x="805" y="328" text-anchor="middle" fill="#6b6560">estimativa ponderada</text>
</g>

<path class="lnk" d="M155 340 L155 370 L15 370 L15 530"/>
<path class="lnk" d="M15 420 L30 420"/>
<path class="lnk" d="M15 475 L30 475"/>
<path class="lnk" d="M15 530 L30 530"/>
<path class="lnk" d="M480 340 L480 400"/>
<path class="lnk" d="M805 340 L805 400"/>

<text class="lbl" x="30" y="388" fill="#6b6560">DIMENSÕES ESPECÍFICAS DE UMA FATO</text>

<g>
  <rect x="30" y="400" width="250" height="40" rx="6" fill="#ffffff" stroke="#c9c0b6" stroke-width="1.3"/>
  <text class="bx" x="45" y="418" fill="#1c1a17">dim_arranjo_trabalho</text>
  <text class="bs" x="45" y="433" fill="#6b6560">remoto · híbrido · presencial · flexível</text>

  <rect x="30" y="455" width="250" height="40" rx="6" fill="#ffffff" stroke="#c9c0b6" stroke-width="1.3"/>
  <text class="bx" x="45" y="473" fill="#1c1a17">dim_porte_empresa</text>
  <text class="bs" x="45" y="488" fill="#6b6560">faixas de número de pessoas</text>

  <rect x="30" y="510" width="250" height="40" rx="6" fill="#ffffff" stroke="#c9c0b6" stroke-width="1.3"/>
  <text class="bx" x="45" y="528" fill="#1c1a17">dim_perfil_dev</text>
  <text class="bs" x="45" y="543" fill="#6b6560">perfil · faixa de experiência</text>

  <rect x="355" y="400" width="250" height="40" rx="6" fill="#ffffff" stroke="#c9c0b6" stroke-width="1.3"/>
  <text class="bx" x="370" y="418" fill="#1c1a17">dim_modalidade_ibge</text>
  <text class="bs" x="370" y="433" fill="#6b6560">hierárquica · não somar entre níveis</text>

  <rect x="680" y="400" width="250" height="40" rx="6" fill="#ffffff" stroke="#c9c0b6" stroke-width="1.3"/>
  <text class="bx" x="695" y="418" fill="#1c1a17">dim_atividade_economica</text>
  <text class="bs" x="695" y="433" fill="#6b6560">grupamentos · total e subgrupamento</text>
</g>

<rect x="355" y="478" width="575" height="72" rx="7" fill="#ffffff" stroke="#c9c0b6" stroke-width="1.3" stroke-dasharray="4 3"/>
<text class="bs" x="372" y="500" fill="#1c1a17" font-weight="600">Por que duas taxonomias de arranjo, e não uma conformada</text>
<text class="bs" x="372" y="518" fill="#6b6560">«remoto» na pesquisa e «teletrabalho» no IBGE medem recortes conceituais diferentes.</text>
<text class="bs" x="372" y="534" fill="#6b6560">As fatos se combinam só pela geografia conformada, depois de agregadas em separado.</text>

<line x1="30" y1="578" x2="930" y2="578" stroke="#e2ddd6" stroke-width="1"/>
<g>
  <rect x="30" y="592" width="14" height="14" rx="3" fill="#e8f1ea" stroke="#2f6b45" stroke-width="1.5"/>
  <text class="bs" x="52" y="604" fill="#6b6560">dimensão conformada, reutilizada pelas três fatos</text>
  <rect x="330" y="592" width="14" height="14" rx="3" fill="#f5ece5" stroke="#8a4b2a" stroke-width="1.5"/>
  <text class="bs" x="352" y="604" fill="#6b6560">tabela fato</text>
  <rect x="450" y="592" width="14" height="14" rx="3" fill="#ffffff" stroke="#c9c0b6" stroke-width="1.3"/>
  <text class="bs" x="472" y="604" fill="#6b6560">dimensão de uma fato só</text>
  <text class="bs" x="30" y="626" fill="#6b6560">Toda dimensão tem o membro −1 (Desconhecido); chave estrangeira nula na tabela fato é proibida.</text>
</g>
</svg>
